<!--
  Plantilla del email "Reset password" de Supabase.

  Va aquí, versionada, porque vive fuera del repositorio —en el dashboard de
  Supabase (Authentication → Emails → Reset password)— y sin una copia nadie
  recuerda cómo debería ser. Si alguien la cambia por ahí, esta es la de
  referencia.

  Dos decisiones deliberadas:

  1. Muestra `{{ .Token }}`, el código de 6 dígitos. La plantilla por defecto de
     Supabase NO lo incluye: solo trae el enlace. Ese era el desajuste — la app
     pedía un código que nunca se enviaba.

  2. NO incluye `{{ .ConfirmationURL }}`. TimeDesk es una app de escritorio sin
     dominio web, así que ese enlace no lleva a ninguna parte útil; peor, al
     pulsarlo Supabase CONSUME el token y redirige al Site URL, dejando el
     código inservible. Quitarlo elimina de raíz la forma más fácil de romper
     la recuperación.

  Los estilos van en línea porque los clientes de correo ignoran las hojas de
  estilo externas y casi todo `<style>` en el head.
-->
<div style="background:#000000;padding:40px 20px;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#161616;border-radius:16px;padding:32px;">
    <p style="margin:0 0 8px;color:#eb3619;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">
      TimeDesk
    </p>

    <h1 style="margin:0 0 12px;color:#f5f5f5;font-size:20px;font-weight:700;">
      Restablece tu contraseña
    </h1>

    <p style="margin:0 0 24px;color:#a3a3a3;font-size:14px;line-height:1.6;">
      Escribe este código en la app para elegir una contraseña nueva:
    </p>

    <div style="background:#000000;border:1px solid #383838;border-radius:10px;padding:20px;text-align:center;margin-bottom:24px;">
      <span style="color:#f5f5f5;font-size:32px;font-weight:700;letter-spacing:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
        {{ .Token }}
      </span>
    </div>

    <p style="margin:0 0 8px;color:#a3a3a3;font-size:13px;line-height:1.6;">
      El código caduca en una hora y solo sirve una vez.
    </p>

    <p style="margin:0;color:#666666;font-size:12px;line-height:1.6;">
      Si no pediste cambiar tu contraseña, ignora este correo: tu cuenta sigue igual.
    </p>
  </div>
</div>
